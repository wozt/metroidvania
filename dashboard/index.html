<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metroidvania Dashboard</title>
<meta name="description" content="Development status of the Metroidvania reconstruction of Metroid: Zero Mission and Castlevania: Aria of Sorrow.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="masthead">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><span class="half metroid"></span><span class="half aria"></span></span>
    <div>
      <h1>Metroidvania</h1>
      <p class="tagline">Development dashboard: what is reproduced, what works, what is faithful, what is tested, what is left.</p>
    </div>
  </div>
  <div class="generated" id="generated"></div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-view="overview" class="active">Overview</button>
  <button data-view="mzm">Zero Mission</button>
  <button data-view="aos">Aria of Sorrow</button>
  <button data-view="metroidvania">Metroidvania</button>
  <button data-view="story">Story</button>
  <button data-view="tools">Tools</button>
  <button data-view="assets">Assets</button>
  <button data-view="platform">Platforms</button>
  <button data-view="tests">Tests</button>
  <button data-view="timeline">Timeline</button>
  <button data-view="attention">Blocked &amp; incomplete</button>
</nav>

<section class="toolbar" id="toolbar">
  <input type="search" id="search" placeholder="Search features, files, routines…" aria-label="Search features">
  <div class="chips" id="status-filter" role="group" aria-label="Filter by status"></div>
</section>

<main id="view"></main>

<noscript><p class="notice">This dashboard needs JavaScript.</p></noscript>
<footer class="footer">
  <p>Generated by <code>python3 -m scripts.dashboard --run-tests</code>. Open this file directly; no server is needed.
  No ROM data or extracted asset is included.</p>
</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
